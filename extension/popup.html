<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aalto</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
    #micBtn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #40AEAF;
      color: #04211f;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    #micBtn.listening { background: #ef4444; color: white; }
    #status { margin-top: 10px; font-size: 12px; color: #94a3b8; min-height: 32px; }
    #transcript { margin-top: 8px; font-size: 13px; color: #e2e8f0; font-style: italic; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-top: 12px; }
    select, input {
      width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px;
      border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f1f5f9;
    }
  </style>
</head>
<body>
  <h1>🎙️ Aalto</h1>
  <button type="button" id="micBtn">Hold to talk</button>
  <div id="status">Ready.</div>
  <div id="transcript"></div>

  <label for="langSelect">Language hint</label>
  <select id="langSelect">
    <option value="">Auto</option>
    <option value="en">English</option>
    <option value="yo">Yoruba</option>
    <option value="ha">Hausa</option>
    <option value="ig">Igbo</option>
    <option value="pcm">Nigerian Pidgin</option>
    <option value="sw">Swahili</option>
  </select>

  <label for="serverUrl">Server URL</label>
  <input id="serverUrl" value="http://localhost:8787" />

  <script src="popup.js"></script>
</body>
</html>
