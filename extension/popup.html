<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aalto</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #1f6feb;
        --ok: #137333;
        --bad: #b3261e;
        --ask: #9a6700;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --line: #2d313a;
          --accent: #4c8dff;
          --ok: #4ade80;
          --bad: #f87171;
          --ask: #fbbf24;
        }
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      #muteBtn {
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--fg);
        cursor: pointer;
        font-size: 14px;
        padding: 4px 8px;
      }
      #muteBtn[aria-pressed="true"] {
        color: var(--muted);
        border-style: dashed;
      }
      #micBtn {
        width: 100%;
        padding: 14px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        touch-action: none;
      }
      #micBtn.listening {
        background: var(--bad);
      }
      #micBtn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #status {
        color: var(--muted);
        margin-top: 10px;
        min-height: 18px;
      }
      #transcript {
        margin-top: 6px;
        font-style: italic;
      }
      #summary {
        margin-top: 8px;
        font-weight: 600;
      }
      ul {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .mark {
        width: 14px;
        flex: none;
      }
      .pending .mark {
        color: var(--muted);
      }
      .ok .mark {
        color: var(--ok);
      }
      .failed .mark {
        color: var(--bad);
      }
      .needs_input .mark {
        color: var(--ask);
      }
      .tool {
        color: var(--muted);
        font-size: 11px;
      }
      details {
        margin-top: 12px;
        color: var(--muted);
      }
      summary {
        cursor: pointer;
      }
      label {
        display: block;
        margin-top: 8px;
        font-size: 11px;
      }
      input,
      select {
        width: 100%;
        padding: 5px;
        margin-top: 2px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎙️ Aalto</h1>
      <button type="button" id="muteBtn" aria-pressed="false" title="Mute spoken replies">
        🔊
      </button>
    </header>

    <button type="button" id="micBtn">Hold to talk</button>
    <div id="status">Ready.</div>
    <div id="transcript"></div>
    <div id="summary"></div>
    <ul id="tasks"></ul>

    <details>
      <summary>Settings</summary>
      <label>
        Server URL
        <input type="text" id="serverUrl" value="http://localhost:8787" />
      </label>
      <label>
        Request key (optional)
        <input type="password" id="apiKey" placeholder="matches AALTO_API_KEY" />
      </label>
      <label>
        Language hint
        <select id="langSelect">
          <option value="">Auto</option>
          <option value="en">English</option>
          <option value="yo">Yoruba</option>
          <option value="ig">Igbo</option>
          <option value="ha">Hausa</option>
          <option value="pcm">Nigerian Pidgin</option>
          <option value="sw">Swahili</option>
        </select>
      </label>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
