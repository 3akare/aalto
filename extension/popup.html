<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aalto</title>
    <style>
      /* Dark-mode Claude: warm near-black surfaces, cream ink, coral used
         sparingly. Palette derived from DESIGN.md's dark tokens.

         Nothing here is bold or semibold. Hierarchy comes from size, colour and
         space — which is also what lets the serif read as editorial rather than
         as a heading in a dashboard. */
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("fonts/CormorantGaramond-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }

      :root {
        --coral: #cc785c;
        --coral-dim: rgba(204, 120, 92, 0.16);

        --bg: #1a1917;
        --stage: #242320;
        --card: #1f1e1b;
        --raised: #2b2926;

        --ink: #faf9f5;
        --ink-soft: #a09d96;
        --ink-faint: #6c6a64;

        --line: rgba(250, 249, 245, 0.07);
        --line-strong: rgba(250, 249, 245, 0.12);

        --ok: #5db872;
        --bad: #d98b7f;
        --ask: #e8a55a;

        --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
        --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        --ease: cubic-bezier(0.32, 0.72, 0, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        margin: 0;
        padding: 16px 16px 18px;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13.5px;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* --- header ------------------------------------------------------- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-left: 2px;
      }
      .wordmark {
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 400;
        letter-spacing: -0.2px;
        line-height: 1;
      }
      .ghost-btn {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 9999px;
        color: var(--ink-faint);
        cursor: pointer;
        transition:
          color 0.18s var(--ease),
          background 0.18s var(--ease);
      }
      .ghost-btn:hover {
        color: var(--ink);
        background: var(--line);
      }
      .ghost-btn:focus-visible {
        outline: 2px solid var(--coral);
        outline-offset: 2px;
      }
      .ghost-btn[aria-expanded="true"] {
        color: var(--ink);
        background: var(--line);
      }

      /* --- stage -------------------------------------------------------- */
      .stage {
        position: relative;
        height: 150px;
        border-radius: 24px;
        background: var(--stage);
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .stage-label {
        position: absolute;
        top: 15px;
        left: 17px;
        font-size: 10.5px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--ink-faint);
        transition: color 0.2s var(--ease);
      }
      .stage-label.live {
        color: var(--coral);
      }

      /* The resting state when opened by hand: press to start. */
      .record {
        width: 62px;
        height: 62px;
        padding: 0;
        border-radius: 9999px;
        border: 1px solid var(--line-strong);
        background: var(--raised);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition:
          transform 0.22s var(--ease),
          background 0.22s var(--ease),
          border-color 0.22s var(--ease),
          box-shadow 0.22s var(--ease);
      }
      .record:hover {
        background: var(--coral);
        border-color: var(--coral);
        transform: scale(1.05);
        box-shadow: 0 0 0 8px var(--coral-dim);
      }
      .record:focus-visible {
        outline: 2px solid var(--coral);
        outline-offset: 4px;
      }
      .record:active {
        transform: scale(0.97);
      }

      .record-hint {
        position: absolute;
        bottom: 15px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11.5px;
        color: var(--ink-faint);
      }
      kbd {
        font-family: var(--sans);
        font-size: 10.5px;
        color: var(--ink-soft);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 1.5px 6px;
      }

      #wave {
        display: block;
        width: 296px;
        height: 62px;
      }

      .loading {
        color: var(--coral);
        animation: spin 0.9s linear infinite;
        transform-origin: center;
        line-height: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #speakerBtn {
        position: absolute;
        right: 11px;
        bottom: 10px;
      }
      #speakerBtn:hover {
        background: var(--line-strong);
      }

      /* Beats the display:grid / display:block set on .record, #wave and the
         reply card, which would otherwise keep them visible when hidden. */
      /* biome-ignore lint/complexity/noImportantStyles: must outrank the layout rules above */
      [hidden] {
        display: none !important;
      }

      /* --- reply -------------------------------------------------------- */
      .reply {
        margin-top: 14px;
        padding: 17px 18px;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--line);
        animation: rise 0.26s var(--ease);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
      }
      .heard {
        font-size: 12px;
        color: var(--ink-faint);
        margin-bottom: 9px;
      }
      .answer {
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 400;
        line-height: 1.34;
        letter-spacing: -0.15px;
        color: var(--ink);
      }
      .answer.is-error {
        font-family: var(--sans);
        font-size: 13.5px;
        color: var(--bad);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .has-answer ul {
        margin-top: 13px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      li {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 5px 0;
        font-size: 12.5px;
        color: var(--ink-soft);
      }
      li svg {
        flex: none;
        margin-top: 1px;
      }
      li.ok svg {
        color: var(--ok);
      }
      li.failed svg {
        color: var(--bad);
      }
      li.needs_input svg {
        color: var(--ask);
      }
      li.pending {
        color: var(--ink-faint);
      }
      li.pending svg {
        color: var(--ink-faint);
        animation: spin 1.1s linear infinite;
        transform-origin: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading,
        li.pending svg {
          animation-duration: 2.6s;
        }
        .record,
        .ghost-btn,
        .reply {
          transition: none;
          animation: none;
        }
      }

      /* --- settings ----------------------------------------------------- */
      .settings {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      label {
        display: block;
        margin-bottom: 11px;
        font-size: 11px;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      input,
      select {
        width: 100%;
        margin-top: 5px;
        padding: 9px 11px;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        color: var(--ink);
        background: var(--stage);
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        transition:
          border-color 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--coral);
        box-shadow: 0 0 0 3px var(--coral-dim);
      }
      .link-row {
        margin: 0;
        font-size: 11.5px;
      }
      .link-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--coral);
        cursor: pointer;
      }
      .link-btn:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="wordmark">Aalto</span>
      <button
        type="button"
        class="ghost-btn"
        id="settingsBtn"
        aria-expanded="false"
        aria-label="Settings"
      ></button>
    </header>

    <div class="stage">
      <span class="stage-label" id="stageLabel"></span>

      <button type="button" class="record" id="recordBtn" aria-label="Start listening"></button>
      <canvas id="wave" width="592" height="124" hidden></canvas>
      <span id="loader" class="loading" hidden></span>

      <div class="record-hint" id="recordHint">
        or press <kbd id="shortcutHint">Alt+A</kbd>
      </div>

      <button
        type="button"
        class="ghost-btn"
        id="speakerBtn"
        aria-pressed="false"
        aria-label="Mute spoken replies"
      ></button>
    </div>

    <section class="reply" id="reply" hidden>
      <div class="heard" id="heard" hidden></div>
      <div class="answer" id="answer" hidden></div>
      <ul id="tasks"></ul>
    </section>

    <section class="settings" id="settings" hidden>
      <label>
        Server
        <input type="text" id="serverUrl" value="http://localhost:8787" />
      </label>
      <label>
        Request key
        <input type="password" id="apiKey" placeholder="optional" />
      </label>
      <label>
        Language
        <select id="langSelect">
          <option value="">Detect automatically</option>
          <option value="en">English</option>
          <option value="yo">Yoruba</option>
          <option value="ig">Igbo</option>
          <option value="ha">Hausa</option>
          <option value="pcm">Nigerian Pidgin</option>
          <option value="sw">Swahili</option>
        </select>
      </label>
      <p class="link-row">
        <button type="button" class="link-btn" id="shortcutLink">Change shortcut</button>
      </p>
    </section>

    <script src="icons.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
